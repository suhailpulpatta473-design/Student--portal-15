<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Portal 15</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f6fb;color:#172033}header{background:linear-gradient(135deg,#163c75,#2875b9);color:white;padding:28px 18px;text-align:center}header h1{margin:0;font-size:28px}header p{margin:8px 0 0;color:#dbeafe}main{max-width:1100px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.search{width:100%;padding:13px 15px;border:1px solid #d3dbea;border-radius:12px;font-size:16px;margin:15px 0}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.stat{background:white;border-radius:12px;padding:14px 18px;box-shadow:0 2px 9px #e3e9f2;flex:1;min-width:130px}.stat strong{display:block;font-size:24px;color:#1d4e89}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.card{background:white;border-radius:16px;padding:18px;box-shadow:0 3px 12px #e1e7f0;text-align:center}.avatar{height:95px;width:95px;border-radius:50%;background:#e6efff;display:flex;align-items:center;justify-content:center;margin:auto;overflow:hidden;font-size:36px}.avatar img{width:100%;height:100%;object-fit:cover}.card h3{margin:12px 0 6px}.muted{color:#64748b;margin:5px}.btn{border:0;border-radius:9px;background:#1d4e89;color:white;padding:10px 15px;cursor:pointer;margin-top:10px}.status{text-align:center;color:#64748b;padding:14px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:5;padding:16px;overflow:auto}.modalbox{max-width:600px;margin:6vh auto;background:white;padding:22px;border-radius:16px}.detailrow{padding:10px 0;border-bottom:1px solid #edf1f6}.detailrow b{display:block;color:#475569;margin-bottom:4px}footer{text-align:center;padding:25px;color:#718096}@media(max-width:480px){main{padding:14px}.top h2{font-size:21px}}
</style>
</head><body>
<header><h1>🎓 Student Portal 15</h1><p>Student Profile & Academic Progress</p></header>
<main><div class="top"><h2>വിദ്യാർത്ഥികൾ</h2></div><div class="stats"><div class="stat"><strong id="count">—</strong>ആകെ വിദ്യാർത്ഥികൾ</div></div><input id="search" class="search" placeholder="വിദ്യാർത്ഥിയുടെ പേര് തിരയുക…"><div id="status" class="status">ഡാറ്റ ലോഡ് ചെയ്യുന്നു…</div><div id="students" class="grid"></div></main>
<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeProfile()"><div class="modalbox"><div id="profile"></div><button class="btn" onclick="closeProfile()">തിരികെ</button></div></div><footer>Student Portal 15 · Academic Progress</footer>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyAjYDcSXRJJ8Ik0MFxo3xst83-c_iJx9jo",authDomain:"student-portal-15.firebaseapp.com",databaseURL:"https://student-portal-15-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"student-portal-15",storageBucket:"student-portal-15.firebasestorage.app",messagingSenderId:"575545424549",appId:"1:575545424549:web:d9d38d882c0e078e112b4c",measurementId:"G-5B68SWW1NC"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();let list=[];
db.ref('students').on('value',snap=>{const d=snap.val()||{};list=Object.entries(d).map(([key,s])=>({id:key,...s}));document.getElementById('count').textContent=list.length;document.getElementById('status').textContent=list.length?`${list.length} വിദ്യാർത്ഥികൾ ലഭിച്ചു`:'വിദ്യാർത്ഥികൾ ചേർത്തിട്ടില്ല';render();},err=>{document.getElementById('status').textContent='ഡാറ്റ ലഭിക്കുന്നതിൽ പ്രശ്നം: '+err.message});
document.getElementById('search').addEventListener('input',render);
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const filtered=list.filter(s=>(s.name||'').toLowerCase().includes(q));const box=document.getElementById('students');box.innerHTML='';filtered.forEach(s=>{const card=document.createElement('article');card.className='card';const av=document.createElement('div');av.className='avatar';if(s.photoURL||s.photo){const img=document.createElement('img');img.src=s.photoURL||s.photo;img.alt=s.name||'Student';av.append(img)}else av.textContent='👤';const h=document.createElement('h3');h.textContent=s.name||'Student';const b=document.createElement('p');b.className='muted';b.textContent=s.batch||'';const c=document.createElement('p');c.className='muted';c.textContent=s.schoolClass||s.class||'';const btn=document.createElement('button');btn.className='btn';btn.textContent='Profile കാണുക';btn.onclick=()=>openProfile(s);card.append(av,h,b,c,btn);box.append(card)});if(!filtered.length)box.innerHTML='<p class="status">വിദ്യാർത്ഥികളെ കണ്ടെത്തിയില്ല.</p>'}
function safe(v){return v===undefined||v===null||v===''?'—':String(v)}
function openProfile(s){const p=document.getElementById('profile');p.innerHTML='';const title=document.createElement('h2');title.textContent=s.name||'Student Profile';p.append(title);const fields=[['Batch',s.batch],['School Class',s.schoolClass||s.class],['Achievements',s.achievement||s.achievements],['Study Progress',s.progress||s.studyProgress],['Teacher Remark',s.teacherRemark]];fields.forEach(([label,value])=>{if(value){const row=document.createElement('div');row.className='detailrow';const b=document.createElement('b');b.textContent=label;const t=document.createElement('div');t.textContent=safe(value);row.append(b,t);p.append(row)}});if(s.examMarks&&typeof s.examMarks==='object'){const row=document.createElement('div');row.className='detailrow';const b=document.createElement('b');b.textContent='Exam Marks';row.append(b);Object.entries(s.examMarks).forEach(([subject,mark])=>{const line=document.createElement('div');line.textContent=subject+': '+mark;row.append(line)});p.append(row)}if(s.attendance&&typeof s.attendance==='object'){const row=document.createElement('div');row.className='detailrow';const b=document.createElement('b');b.textContent='Attendance';row.append(b);['present','absent','totalDays'].forEach(k=>{if(s.attendance[k]!==undefined){const line=document.createElement('div');line.textContent=({present:'Present',absent:'Absent',totalDays:'Total Days'}[k])+': '+s.attendance[k];row.append(line)}});p.append(row)}document.getElementById('modal').style.display='block'}
function closeProfile(){document.getElementById('modal').style.display='none'}
</script></body></html>
