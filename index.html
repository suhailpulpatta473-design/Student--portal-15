<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal 15</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#172033}
header{background:#163c75;color:white;padding:25px 18px;text-align:center}
header h1{margin:0;font-size:26px}
header p{margin:8px 0 0;color:#d9e8ff}
nav{background:white;padding:12px;text-align:center;box-shadow:0 2px 6px #ddd}
nav button{border:0;background:#163c75;color:white;padding:10px 18px;border-radius:8px;margin:4px}
main{max-width:1000px;margin:auto;padding:18px}
.search{width:100%;padding:13px;border:1px solid #ccd4e2;border-radius:10px;font-size:16px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card{background:white;border-radius:14px;padding:18px;box-shadow:0 3px 12px #e0e5ed;text-align:center}
.photo{width:90px;height:90px;border-radius:50%;background:#e5edff;display:flex;align-items:center;justify-content:center;margin:auto;font-size:35px}
.card h3{margin:12px 0 5px}
.card p{color:#64748b;margin:5px}
.profile{margin-top:12px;background:#edf3ff;border:0;color:#163c75;padding:10px 15px;border-radius:8px}
footer{text-align:center;padding:25px;color:#777}
#login{display:none;background:white;padding:20px;border-radius:12px;max-width:400px;margin:20px auto}
#login input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
</style>
</head>
<body>

<header>
<h1>Student Portal</h1>
<p>Student Profile & Academic Progress</p>
</header>

<nav>
<button onclick="showHome()">Home</button>
<button onclick="showLogin()">Teacher Login</button>
</nav>

<main>
<h2>Students</h2>
<input class="search" id="search" placeholder="വിദ്യാർത്ഥിയുടെ പേര് തിരയുക..." oninput="searchStudents()">
<div class="grid" id="students"></div>

<div id="login">
<h2>Teacher Login</h2>
<input type="email" placeholder="Email">
<input type="password" placeholder="Password">
<button onclick="alert('Firebase Login അടുത്ത ഘട്ടത്തിൽ ബന്ധിപ്പിക്കും')">Login</button>
<button onclick="showHome()">Back</button>
</div>
</main>

<footer>Student Portal • Academic Progress</footer>

<script>
const students = Array.from({length:15},(_,i)=>({
 id:i+1,
 name:"Student "+String(i+1).padStart(2,"0"),
 batch:"Batch 2026",
 schoolClass:"Class 7"
}));

function displayStudents(list){
 const box=document.getElementById("students");
 box.innerHTML="";
 list.forEach(s=>{
  box.innerHTML+=`
   <div class="card">
    <div class="photo">👤</div>
    <h3>${s.name}</h3>
    <p>${s.batch}</p>
    <p>${s.schoolClass}</p>
    <button class="profile" onclick="viewProfile(${s.id})">View Profile</button>
   </div>`;
 });
}
function searchStudents(){
 const q=document.getElementById("search").value.toLowerCase();
 displayStudents(students.filter(s=>s.name.toLowerCase().includes(q)));
}
function viewProfile(id){
 const s=students.find(x=>x.id===id);
 alert("Student: "+s.name+"\nBatch: "+s.batch+"\nClass: "+s.schoolClass+"\n\nDetailed profiles will be added in the next step.");
}
function showLogin(){
 document.getElementById("students").style.display="none";
 document.getElementById("search").style.display="none";
 document.getElementById("login").style.display="block";
}
function showHome(){
 document.getElementById("students").style.display="grid";
 document.getElementById("search").style.display="block";
 document.getElementById("login").style.display="none";
 searchStudents();
}
displayStudents(students);
</script>
</body>
  </html>
