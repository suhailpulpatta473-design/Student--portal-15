
<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal 15</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#172033
}
header{
  background:#163c75;
  color:white;
  padding:25px 18px;
  text-align:center
}
header h1{margin:0;font-size:27px}
header p{margin:8px 0 0;color:#d9e8ff}
nav{
  background:white;
  padding:12px;
  text-align:center;
  box-shadow:0 2px 6px #ddd
}
nav button{
  border:0;
  background:#163c75;
  color:white;
  padding:10px 18px;
  border-radius:8px;
  margin:4px
}
main{
  max-width:1000px;
  margin:auto;
  padding:18px
}
.search{
  width:100%;
  padding:13px;
  border:1px solid #ccd4e2;
  border-radius:10px;
  font-size:16px;
  margin-bottom:18px
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px
}
.card{
  background:white;
  border-radius:14px;
  padding:18px;
  box-shadow:0 3px 12px #e0e5ed;
  text-align:center
}
.photo{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#e5edff;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-size:35px;
  overflow:hidden
}
.photo img{
  width:100%;
  height:100%;
  object-fit:cover
}
.card h3{margin:12px 0 5px}
.card p{color:#64748b;margin:5px}
.btn{
  border:0;
  background:#163c75;
  color:white;
  padding:10px 15px;
  border-radius:8px;
  margin:5px;
  cursor:pointer
}
.profile{
  margin-top:12px;
  background:#edf3ff;
  border:0;
  color:#163c75;
  padding:10px 15px;
  border-radius:8px
}
.panel{
  background:white;
  padding:20px;
  border-radius:12px;
  margin:20px 0;
  box-shadow:0 3px 12px #e0e5ed
}
.panel input,.panel textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:1px solid #ccd4e2;
  border-radius:8px;
  font-size:16px
}
#login,#addStudent,#profilePage{display:none}
footer{text-align:center;padding:25px;color:#777}
.message{padding:12px;margin:10px 0;border-radius:8px}
</style>
</head>

<body>

<header>
<h1>Student Portal</h1>
<p>Student Profile & Academic Progress</p>
</header>

<nav>
<button onclick="showHome()">Home</button>
<button onclick="showLogin()">Teacher Login</button>
<button onclick="logoutTeacher()" id="logoutBtn" style="display:none">Logout</button>
</nav>

<main>

<div id="homePage">
<h2>വിദ്യാർത്ഥികൾ</h2>
<input class="search" id="search"
placeholder="വിദ്യാർത്ഥിയുടെ പേര് തിരയുക..."
oninput="searchStudents()">

<div class="grid" id="students"></div>
</div>

<!-- Teacher Login -->
<div id="login" class="panel">
<h2>Teacher Login</h2>
<input id="email" type="email" placeholder="Teacher Email">
<input id="password" type="password" placeholder="Password">
<button class="btn" onclick="teacherLogin()">Login</button>
<button class="btn" onclick="showHome()">Back</button>
<p id="loginMessage"></p>
</div>

<!-- Add Student -->
<div id="addStudent" class="panel">
<h2>പുതിയ വിദ്യാർത്ഥിയെ ചേർക്കുക</h2>

<input id="studentName" placeholder="Student Name">
<input id="studentBatch" placeholder="Batch">
<input id="studentClass" placeholder="School Class">
<input id="studentPhoto" placeholder="Photo URL (optional)">
<input id="studentAchievement" placeholder="Achievements (optional)">
<textarea id="studentProgress" placeholder="Study Progress"></textarea>

<button class="btn" onclick="addStudent()">Save Student</button>
<button class="btn" onclick="showHome()">Back</button>

<p id="addMessage"></p>
</div>

<!-- Student Profile -->
<div id="profilePage" class="panel"></div>

</main>

<footer>Student Portal • Academic Progress</footer>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot
} from
"https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

// Firebase Configuration
const firebaseConfig = {
  apiKey: "AIzaSyAjYDcSXRJJ8Ik0MFxo3xst83-c_iJx9jo",
  authDomain: "student-portal-15.firebaseapp.com",
  databaseURL: "https://student-portal-15-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "student-portal-15",
  storageBucket: "student-portal-15.firebasestorage.app",
  messagingSenderId: "575545424549",
  appId: "1:575545424549:web:d9d38d882c0e078e112b4c",
  measurementId: "G-5B68SWW1NC"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let students = [];
let teacher = null;

// Listen for Firebase student data
onSnapshot(collection(db,"students"), (snapshot)=>{
  students = snapshot.docs.map(doc=>({
    id:doc.id,
    ...doc.data()
  }));
  displayStudents(students);
});

// Authentication status
onAuthStateChanged(auth,user=>{
  teacher=user;

  document.getElementById("logoutBtn").style.display =
    user ? "inline-block" : "none";

  if(user){
    document.getElementById("addStudent").style.display="block";
  }else{
    document.getElementById("addStudent").style.display="none";
  }
});

// Display student list
function displayStudents(list){
  const box=document.getElementById("students");
  box.innerHTML="";

  if(list.length===0){
    box.innerHTML="<p>വിദ്യാർത്ഥികൾ ഇതുവരെ ചേർത്തിട്ടില്ല.</p>";
    return;
  }

  list.forEach(s=>{
    const card=document.createElement("div");
    card.className="card";

    const photo=document.createElement("div");
    photo.className="photo";

    if(s.photoURL){
      const img=document.createElement("img");
      img.src=s.photoURL;
      img.alt=s.name || "Student";
      photo.appendChild(img);
    }else{
      photo.textContent="👤";
    }

    const name=document.createElement("h3");
    name.textContent=s.name || "Student";

    const batch=document.createElement("p");
    batch.textContent=s.batch || "";

    const cls=document.createElement("p");
    cls.textContent=s.schoolClass || "";

    const button=document.createElement("button");
    button.className="profile";
    button.textContent="View Profile";
    button.onclick=()=>viewProfile(s.id);

    card.append(photo,name,batch,cls,button);
    box.appendChild(card);
  });
}

// Search students
window.searchStudents=function(){
  const q=document.getElementById("search").value.toLowerCase();

  displayStudents(
    students.filter(s=>(s.name||"").toLowerCase().includes(q))
  );
};

// Home page
window.showHome=function(){
  document.getElementById("homePage").style.display="block";
  document.getElementById("login").style.display="none";
  document.getElementById("profilePage").style.display="none";
  searchStudents();
};

// Login page
window.showLogin=function(){
  document.getElementById("homePage").style.display="none";
  document.getElementById("profilePage").style.display="none";
  document.getElementById("login").style.display="block";
};

// Teacher login
window.teacherLogin=async function(){
  const email=document.getElementById("email").value;
  const password=document.getElementById("password").value;
  const message=document.getElementById("loginMessage");

  try{
    await signInWithEmailAndPassword(auth,email,password);
    message.textContent="Login വിജയിച്ചു!";
    showHome();
  }catch(error){
    message.textContent="Login പരാജയപ്പെട്ടു: "+error.message;
  }
};

// Teacher logout
window.logoutTeacher=async function(){
  await signOut(auth);
  showHome();
  alert("Logout ചെയ്തു");
};

// Add new student
window.addStudent=async function(){
  if(!auth.currentUser){
    alert("ആദ്യം Teacher Login ചെയ്യുക");
    return;
  }

  const name=document.getElementById("studentName").value.trim();
  const batch=document.getElementById("studentBatch").value.trim();
  const schoolClass=document.getElementById("studentClass").value.trim();
  const photoURL=document.getElementById("studentPhoto").value.trim();
  const achievement=document.getElementById("studentAchievement").value.trim();
  const progress=document.getElementById("studentProgress").value.trim();

  if(!name){
    alert("വിദ്യാർത്ഥിയുടെ പേര് നൽകുക");
    return;
  }

  try{
    await addDoc(collection(db,"students"),{
      name,
      batch,
      schoolClass,
      photoURL,
      achievement,
      progress,
      createdAt:new Date()
    });

    document.getElementById("addMessage").textContent=
      "വിദ്യാർത്ഥിയെ വിജയകരമായി ചേർത്തു!";

    document.getElementById("studentName").value="";
    document.getElementById("studentBatch").value="";
    document.getElementById("studentClass").value="";
    document.getElementById("studentPhoto").value="";
    document.getElementById("studentAchievement").value="";
    document.getElementById("studentProgress").value="";

  }catch(error){
    document.getElementById("addMessage").textContent=
      "Error: "+error.message;
  }
};

// Student profile
window.viewProfile=function(id){
  const s=students.find(x=>x.id===id);
  if(!s)return;

  const page=document.getElementById("profilePage");
  page.innerHTML="";

  const title=document.createElement("h2");
  title.textContent=s.name || "Student Profile";

  const details=document.createElement("div");

  function addDetail(label,value){
    const p=document.createElement("p");
    p.textContent=label+": "+(value || "Not added");
    details.appendChild(p);
  }

  addDetail("Batch",s.batch);
  addDetail("Class",s.schoolClass);
  addDetail("Achievement",s.achievement);
  addDetail("Study Progress",s.progress);

  const back=document.createElement("button");
  back.className="btn";
  back.textContent="Back";
  back.onclick=showHome;

  page.append(title,details,back);

  document.getElementById("homePage").style.display="none";
  document.getElementById("login").style.display="none";
  page.style.display="block";
};

showHome();

</script>
</body>
</html>
