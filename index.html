<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal 15</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Noto Sans Malayalam',sans-serif;background:#f1f5f9;color:#172033}header{background:linear-gradient(135deg,#155eaa,#2876c7);color:#fff;text-align:center;padding:26px 14px}header h1{margin:0;font-size:1.55rem}header p{margin:7px 0 0;opacity:.9}.wrap{max-width:1100px;margin:auto;padding:20px}.panel,.card{background:white;border-radius:16px;padding:18px;box-shadow:0 4px 14px #0f172a12;margin-bottom:16px}.login{max-width:440px;margin:30px auto}.field{margin:12px 0}.field label{display:block;font-weight:600;margin-bottom:6px}.field input,.field select,.field textarea,input.search{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:#fff}.field textarea{min-height:75px}.btn{border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:600;background:#1769b2;color:#fff;cursor:pointer}.btn.secondary{background:#64748b}.btn.danger{background:#b42323}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.student{cursor:pointer;text-align:center}.student img{width:100px;height:100px;border-radius:50%;object-fit:cover;background:#e5edff}.avatar{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;background:#e5edff;color:#2169b3;font-size:40px;margin:auto}.muted{color:#64748b}.hidden{display:none!important}.notice{padding:12px;border-radius:10px;background:#fff7ed;color:#9a3412;margin:12px 0}.status{margin:10px 0;color:#b42323}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:5}.modalbox{background:white;border-radius:16px;width:min(700px,100%);max-height:92vh;overflow:auto;padding:18px}.modalbox h2{margin-top:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}@media(max-width:600px){.two{grid-template-columns:1fr}.wrap{padding:12px}.panel{padding:14px}}
</style>
</head>
<body>
<header><h1>🎓 Student Portal 15</h1><p>Student Profile & Academic Progress</p></header>
<main class="wrap">
<section id="loginPanel" class="panel login"><h2>🔐 Teacher Login</h2><p class="muted">അധ്യാപക Email, Password ഉപയോഗിച്ച് പ്രവേശിക്കുക.</p>
<div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" placeholder="Teacher email" required></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password" required></div>
<button id="loginBtn" class="btn">Login</button><div id="loginStatus" class="status"></div></section>
<section id="appPanel" class="hidden">
<div class="panel toprow"><div><h2 style="margin:0">വിദ്യാർത്ഥികൾ</h2><span id="count" class="muted"></span></div><div class="btnrow"><button id="addBtn" class="btn">+ Student ചേർക്കുക</button><button id="logoutBtn" class="btn secondary">Logout</button></div></div>
<div class="panel"><input id="search" class="search" placeholder="വിദ്യാർത്ഥിയുടെ പേര് തിരയുക..."></div><div id="studentGrid" class="grid"></div><div id="appStatus" class="status"></div>
</section></main>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="toprow"><h2 id="modalTitle">Student Details</h2><button id="closeModal" class="btn secondary">Close</button></div><form id="studentForm"><div class="two">
<div class="field"><label>Student ID</label><input id="sid" required></div><div class="field"><label>Name</label><input id="sname" required></div>
<div class="field"><label>Photo URL (optional)</label><input id="photo" type="url" placeholder="https://..."></div><div class="field"><label>Batch</label><input id="batch"></div>
<div class="field"><label>School Class</label><input id="schoolClass"></div><div class="field"><label>Date of Birth</label><input id="dob" type="date"></div>
<div class="field"><label>Attendance (Present)</label><input id="present" type="number" min="0"></div><div class="field"><label>Attendance (Absent)</label><input id="absent" type="number" min="0"></div><div class="field"><label>Total Days</label><input id="totalDays" type="number" min="0"></div>
<div class="field"><label>Exam Marks</label><input id="marks" placeholder="e.g. 85/100"></div><div class="field"><label>Study Progress</label><input id="progress" placeholder="e.g. Good / 80%"></div></div>
<div class="field"><label>Achievements</label><textarea id="achievements"></textarea></div><div class="field"><label>Teacher Remark</label><textarea id="remark"></textarea></div><div class="actions"><button class="btn" type="submit">Save Student</button><button id="deleteBtn" type="button" class="btn danger hidden">Delete Student</button></div><div id="formStatus" class="status"></div></form></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyAjYDcSXRJJ8Ik0MFxo3xst83-c_iJx9jo",authDomain:"student-portal-15.firebaseapp.com",databaseURL:"https://student-portal-15-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"student-portal-15",storageBucket:"student-portal-15.firebasestorage.app",messagingSenderId:"575545424549",appId:"1:575545424549:web:d9d38d882c0e078e112b4c",measurementId:"G-5B68SWW1NC"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();
const $=id=>document.getElementById(id);let students={},editingKey=null;
function setStatus(id,msg){$(id).textContent=msg}
function showApp(user){$('loginPanel').classList.add('hidden');$('appPanel').classList.remove('hidden');setStatus('appStatus','');loadStudents()}
function showLogin(){$('loginPanel').classList.remove('hidden');$('appPanel').classList.add('hidden')}
auth.onAuthStateChanged(user=>{if(user)showApp(user);else showLogin()});
$('loginBtn').onclick=async()=>{setStatus('loginStatus','');try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value)}catch(e){setStatus('loginStatus','Login failed: '+e.message)}};
$('logoutBtn').onclick=()=>auth.signOut();
function loadStudents(){db.ref('students').once('value').then(s=>{students=s.val()||{};render()}).catch(e=>setStatus('appStatus','Data load failed: '+e.message))}
function render(){const grid=$('studentGrid');grid.replaceChildren();const q=$('search').value.trim().toLowerCase();const entries=Object.entries(students).filter(([k,s])=>(s.name||k).toLowerCase().includes(q));$('count').textContent=entries.length+' students';entries.forEach(([key,s])=>{const card=document.createElement('article');card.className='card student';card.onclick=()=>openEditor(key,s);if(s.photo||s.photoURL){const im=document.createElement('img');im.src=s.photo||s.photoURL;im.alt='Student photo';im.onerror=()=>{im.replaceWith(makeAvatar())};card.append(im)}else card.append(makeAvatar());const h=document.createElement('h3');h.textContent=s.name||key;const p=document.createElement('p');p.className='muted';p.textContent=(s.batch||'')+(s.schoolClass?' • '+s.schoolClass:'');card.append(h,p);grid.append(card)});}
function makeAvatar(){const a=document.createElement('div');a.className='avatar';a.textContent='👤';return a}
$('search').oninput=render;
function openEditor(key,s={}){editingKey=key;$('modalTitle').textContent=key?'Edit Student':'Add Student';$('deleteBtn').classList.toggle('hidden',!key);$('sid').value=key||'';$('sid').disabled=!!key;$('sname').value=s.name||'';$('photo').value=s.photo||s.photoURL||'';$('batch').value=s.batch||'';$('schoolClass').value=s.schoolClass||s.class||'';$('dob').value=s.dateOfBirth||'';$('present').value=s.attendance?.present??'';$('absent').value=s.attendance?.absent??'';$('totalDays').value=s.attendance?.totalDays??'';$('marks').value=typeof s.examMarks==='object'?JSON.stringify(s.examMarks):s.examMarks||'';$('progress').value=s.studyProgress||s.progress||'';$('achievements').value=s.achievements||s.achievement||'';$('remark').value=s.teacherRemark||'';setStatus('formStatus','');$('modal').classList.remove('hidden')}
$('addBtn').onclick=()=>openEditor(null,{});$('closeModal').onclick=()=>$('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')};
$('studentForm').onsubmit=async e=>{e.preventDefault();const key=$('sid').value.trim();if(!key){setStatus('formStatus','Student ID ആവശ്യമാണ്.');return}const record={name:$('sname').value.trim(),photo:$('photo').value.trim(),batch:$('batch').value.trim(),schoolClass:$('schoolClass').value.trim(),dateOfBirth:$('dob').value,attendance:{present:Number($('present').value||0),absent:Number($('absent').value||0),totalDays:Number($('totalDays').value||0)},examMarks:$('marks').value.trim(),studyProgress:$('progress').value.trim(),achievements:$('achievements').value.trim(),teacherRemark:$('remark').value.trim()};try{await db.ref('students/'+key).set(record);students[key]=record;render();$('modal').classList.add('hidden')}catch(err){setStatus('formStatus','Save failed: '+err.message)}};
$('deleteBtn').onclick=async()=>{if(!editingKey||!confirm('ഈ വിദ്യാർത്ഥിയെ Delete ചെയ്യണോ?'))return;try{await db.ref('students/'+editingKey).remove();delete students[editingKey];render();$('modal').classList.add('hidden')}catch(e){setStatus('formStatus','Delete failed: '+e.message)}};
</script></body></html>
